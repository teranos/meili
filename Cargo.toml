[workspace]

[workspace.package]
edition = "2021"
license = "MIT"

# The lint wall of teranos/QNTX's Cargo.toml ([workspace.lints]), kept by a
# plugin that left that workspace.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unwrap_in_result = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"

[package]
name = "qntx-meili"
version = "0.8.13"
edition.workspace = true
description = "QNTX search provider plugin — routes SearchService RPCs to MeiliSearch"
license.workspace = true
authors = ["QNTX Contributors"]

[lints]
workspace = true

[[bin]]
name = "qntx-meili"
path = "src/main.rs"

[dependencies]
# QNTX gRPC infrastructure: not on crates.io, so pinned to QNTX's tag.
qntx-grpc = { git = "https://github.com/teranos/QNTX", tag = "v0.44.0", features = ["plugin"] }
qntx-proto = { git = "https://github.com/teranos/QNTX", tag = "v0.44.0" }

# gRPC and async
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# MeiliSearch client
meilisearch-sdk = "0.27"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
thiserror = "2"
parking_lot = "0.12"
